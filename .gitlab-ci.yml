
stages:
  - build
  - deploy

publish:
  stage: build
  image: python:3.10
  script:
    - pip install build twine
    - python -m build
    - python -m twine upload -r pypi -u __token__ -p "$PYPI_API_TOKEN" dist/*
  rules:
    - if: $CI_COMMIT_TAG

pages:
  stage: deploy
  image: python:3.10
  script:
    - pip install --upgrade pip
    - pip install ".[docs]"
    - mkdocs build --site-dir public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

